interface:
  display_name: "CosyVoice 自然语音"
  short_description: "把文本转为低音量、自然且尽量快速的 SSML"
  default_prompt: "Use $cosyvoice-natural-ssml to turn this text into quiet, natural speech with minimal delay."

dependencies:
  tools:
    - type: "mcp"
      value: "cosyvoice"
      description: "Local CosyVoice MCP server exposing synthesize_speech"

policy:
  allow_implicit_invocation: true
